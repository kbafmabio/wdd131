<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> My Country | page</title>
    <meta name="author" content="Kouassi Bienvenue Adjoua Felicite Mabio">
    <meta name="description" content="explore my beautiful country through photograph, data and weather informations ">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Merriweather+Sans:wght@300;400;500;600;700;800&family=Roboto+Mono:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles/place.css">
    <link rel="stylesheet" href="styles/place-large.css">


    <script src="scripts/getdates.js" defer></script>
    <script src="scripts/place.js" defer></script>
</head>

<body>
    <header>
        <h1>Ivory Coast</h1>
    </header>
    <main>
        <div class="hero">
            <picture>
                <source srcset="images/hero-cacoa.webp" media="(min-width: 1000px)">
                <source srcset="images/hero-large(1).webp" media="(min-width: 750px)">
                <img src="images/hero-" alt="Ivory Coast cacao" width="500" height="250">
            </picture>
        </div>
        <section class="card">
            <div>
                <p>Area: <span id="area"></span></p>
                <p>Population: <span id="population"></span></p>
                <p>Capital: <span id="capital"></span></p>
                <p>Languages: <span id="languages"></span></p>
                <p>Currency: <span id="currency"></span></p>
                <p>Time Zone: <span id="time"></span></p>
                <p>Calling Code: <span id="code"></span></p>
                <p>Internet TLD: <span id="internet"></span></p>
            </div>

        </section>
        <section class="weather-card">
            <div class="weather">
                <h2>Weather</h2>

                <img src="" alt="Weather icon" id="weather-icon">

                <p>Temperature: <span id="temperature"></span></p>
                <p>Conditions: <span id="condition"></span></p>
                <p>Wind: <span id="wind"></span></p>
                <p>Wind Chill: <span id="wind-chill"></span></p>
            </div>
        </section>


    </main>
    <footer>
        <p> &copy; <span id="currentyear"></span> 🌸 Kouassi Bienvenue Adjoua Felicite Mabio 🌸 Ivory Coast</p>
        <p> Last Modified: <span id="lastModified"></span></p>
    </footer>
</body>

</html>
